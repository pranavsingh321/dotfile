general:
  startup_commands: ['shell-exec zebar']
  shutdown_commands: ['shell-exec taskkill /IM zebar.exe /F']
  config_reload_commands: []

  focus_follows_cursor: false
  toggle_workspace_on_refocus: false

  cursor_jump:
    enabled: false
    trigger: 'monitor_focus'

  hide_method: 'cloak'
  show_all_in_taskbar: false


gaps:
  scale_with_dpi: true
  inner_gap: '2px'
  outer_gap:
    top: '2px'
    right: '2px'
    bottom: '2px'
    left: '2px'


window_effects:
  focused_window:
    border:
      enabled: false
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: false
      style: 'square'
    transparency:
      enabled: false
      opacity: '95%'

  other_windows:
    border:
      enabled: false
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: false
      style: 'square'
    transparency:
      enabled: false
      opacity: '0%'


window_behavior:
  initial_state: 'tiling'

  state_defaults:
    floating:
      centered: true
      shown_on_top: false

    fullscreen:
      maximized: false
      shown_on_top: false


workspaces:
  - name: '1'
  - name: '2'
  - name: '3'
  - name: '4'
  - name: '5'
  - name: '6'
  - name: '7'
  - name: '8'
  - name: '9'


# =========================================================
# WINDOW RULES (STABLE + MINIMAL)
# =========================================================
window_rules:

  # ----------------------------
  # FIX: native Windows menus (safe)
  # ----------------------------
  - commands: ['ignore']
    match:
      - window_class:
          equals: '#32768'


  # ----------------------------
  # IGNORE SYSTEM WINDOWS
  # ----------------------------
  - commands: ['ignore']
    match:
      - window_process: { equals: 'zebar' }

      - window_title:
          regex: '[Pp]icture.in.[Pp]icture'
        window_class:
          regex: 'Chrome_WidgetWin_1|MozillaDialogClass'

      - window_process:
          equals: 'PowerToys'
        window_class:
          regex: 'HwndWrapper\\[PowerToys.*?\\]'

      - window_process:
          equals: 'Lively'
        window_class:
          regex: 'HwndWrapper'


  # ----------------------------
  # ELECTRON POPUPS ONLY (SAFE)
  # ----------------------------
  - commands: ['ignore']
    match:
      - window_class:
          regex: 'Chrome_WidgetWin_1'
        window_title:
          regex: '.*(menu|dropdown|tooltip).*'


  # ----------------------------
  # OUTLOOK FIX (IMPORTANT)
  # ----------------------------
  - commands: ['set-floating']
    match:
      - window_process:
          regex: "OUTLOOK.EXE|olk.exe|olkdesktop.exe"


  # ----------------------------
  # NOTEPAD FIX (IMPORTANT)
  # ----------------------------
  - commands: ['set-floating']
    match:
      - window_process:
          equals: "Notepad.exe"


  # ----------------------------
  # DIALOG WINDOWS → FLOAT
  # ----------------------------
  - commands: ['set-floating --centered']
    match:
      - window_title:
          regex: '.*(Open|Save|Browse|Select).*'


  # ----------------------------
  # APP PLACEMENT
  # ----------------------------
  - commands: ["move --workspace 1"]
    match:
      - window_process:
          equals: "WindowsTerminal.exe"

  - commands: ["move --workspace 2"]
    match:
      - window_process:
          equals: "brave.exe"

  - commands: ["move --workspace 3"]
    match:
      - window_process:
          equals: "explorer.exe"

  - commands: ["move --workspace 4"]
    match:
      - window_process:
          regex: "OUTLOOK.EXE|olk.exe|olkdesktop.exe"

  - commands: ["move --workspace 5"]
    match:
      - window_process:
          regex: "ms-teams.exe|Teams.exe|ms-teamsbootstrapper.exe"

  - commands: ["move --workspace 8"]
    match:
      - window_process:
          equals: "chrome.exe"


# =========================================================
# BINDING MODES
# =========================================================
binding_modes:
  - name: 'resize'
    keybindings:
      - commands: ['resize --width -2%']
        bindings: ['h', 'left']
      - commands: ['resize --width +2%']
        bindings: ['l', 'right']
      - commands: ['resize --height +2%']
        bindings: ['k', 'up']
      - commands: ['resize --height -2%']
        bindings: ['j', 'down']
      - commands: ['wm-disable-binding-mode --name resize']
        bindings: ['escape', 'enter']


# =========================================================
# KEYBINDINGS
# =========================================================
keybindings:

  - commands: ['focus --direction left']
    bindings: ['alt+h', 'alt+left']
  - commands: ['focus --direction right']
    bindings: ['alt+l', 'alt+right']
  - commands: ['focus --direction up']
    bindings: ['alt+k', 'alt+up']
  - commands: ['focus --direction down']
    bindings: ['alt+j', 'alt+down']

  - commands: ['focus --prev-active-workspace']
    bindings: ['alt+,']
  - commands: ['focus --next-active-workspace']
    bindings: ['alt+.']
  - commands: ['focus --recent-workspace']
    bindings: ['alt+/']

  - commands: ['focus --workspace 1']
    bindings: ['alt+1']
  - commands: ['focus --workspace 2']
    bindings: ['alt+2']
  - commands: ['focus --workspace 3']
    bindings: ['alt+3']
  - commands: ['focus --workspace 4']
    bindings: ['alt+4']
  - commands: ['focus --workspace 5']
    bindings: ['alt+5']
  - commands: ['focus --workspace 6']
    bindings: ['alt+6']
  - commands: ['focus --workspace 7']
    bindings: ['alt+7']
  - commands: ['focus --workspace 8']
    bindings: ['alt+8']
  - commands: ['focus --workspace 9']
    bindings: ['alt+9']

  - commands: ['move --workspace 1', 'focus --workspace 1']
    bindings: ['alt+shift+1']
  - commands: ['move --workspace 2', 'focus --workspace 2']
    bindings: ['alt+shift+2']
  - commands: ['move --workspace 3', 'focus --workspace 3']
    bindings: ['alt+shift+3']
  - commands: ['move --workspace 4', 'focus --workspace 4']
    bindings: ['alt+shift+4']
  - commands: ['move --workspace 5', 'focus --workspace 5']
    bindings: ['alt+shift+5']
  - commands: ['move --workspace 6', 'focus --workspace 6']
    bindings: ['alt+shift+6']
  - commands: ['move --workspace 7', 'focus --workspace 7']
    bindings: ['alt+shift+7']
  - commands: ['move --workspace 8', 'focus --workspace 8']
    bindings: ['alt+shift+8']
  - commands: ['move --workspace 9', 'focus --workspace 9']
    bindings: ['alt+shift+9']

  - commands: ['wm-cycle-focus']
    bindings: ['alt+space']
  - commands: ['toggle-floating --centered']
    bindings: ['alt+shift+space']
  - commands: ['toggle-tiling']
    bindings: ['alt+shift+t']
  - commands: ['toggle-fullscreen']
    bindings: ['alt+shift+f']
  - commands: ['toggle-minimized']
    bindings: ['alt+shift+m']
  - commands: ['close']
    bindings: ['alt+shift+q']

  - commands: ['wm-toggle-pause']
    bindings: ['alt+shift+p']
  - commands: ['wm-exit']
    bindings: ['alt+shift+e']
  - commands: ['wm-reload-config']
    bindings: ['alt+shift+r']
  - commands: ['wm-redraw']
    bindings: ['alt+shift+w']

  - commands: ['wm-enable-binding-mode --name resize']
    bindings: ['alt+r']

  - commands: ["shell-exec wt"]
    bindings: ["alt+ctrl+t"]

  - commands: ["shell-exec explorer"]
    bindings: ["alt+ctrl+e"]

  - commands: ["shell-exec code"]
    bindings: ["alt+ctrl+v"]

  - commands: ["shell-exec brave"]
    bindings: ["alt+ctrl+b"]

  - commands: ["shell-exec start outlook"]
    bindings: ["alt+ctrl+o"]

  - commands: ["shell-exec start ms-teams"]
    bindings: ["alt+ctrl+m"]

  - commands: ["shell-exec start sticky notes"]
    bindings: ["alt+ctrl+n"]
