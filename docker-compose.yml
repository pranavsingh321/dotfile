services:
  dottools:
    build:
      context: .
      args:
        USERNAME: dev
        # Match your host user so mounted files keep sane ownership:
        #   USER_ID=$(id -u) GROUP_ID=$(id -g) docker compose build
        UID: ${USER_ID:-1000}
        GID: ${GROUP_ID:-1000}
    image: dottools
    init: true            # proper signal handling / zombie reaping
    tty: true
    stdin_open: true
    working_dir: /workspace
    volumes:
      # Project under analysis; override with PROJECT_DIR=/path/to/repo.
      - ${PROJECT_DIR:-~}:/workspace
      # Persist the whole dev home: shell history, tmux resurrect/continuum
      # saves, go/cargo/npm caches, helix session state, and ~/.secret.
      - dotfiles-home:/home/dev
      # Keep the Python package cache separate (easy to clear without nuking
      # everything else in the home volume).
      - uv-cache:/home/dev/.cache/uv
      # Mount the host root alongside home for host-wide analysis. Read-only by
      # default; override with MOUNT_ROOT=/ and MOUNT_ROOT_MODE=rw if needed.
      - ${MOUNT_ROOT:-/}:/host:${MOUNT_ROOT_MODE:-ro}
      # --- opencode: reuse the host binary, config, and data so opencode
      # launched inside the container behaves exactly like the host install.
      # Host paths derive from ${HOME} (the host user's home, expanded by
      # compose), so the same file works on macOS / Ubuntu with any username.
      # Set OPENCODE_BIN to the host opencode binary path, e.g.
      # OPENCODE_BIN=$(command -v opencode) docker compose run --rm dottools
      - ${OPENCODE_BIN:-~/.opencode/bin/opencode}:/usr/local/bin/opencode:ro
      - ${HOME}/.config/opencode:/home/dev/.config/opencode
      - ${HOME}/.local/share/opencode:/home/dev/.local/share/opencode

volumes:
  uv-cache:
  dotfiles-home:
